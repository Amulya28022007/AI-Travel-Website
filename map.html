<!DOCTYPE html>
<html>
<head>
  <title>My Travel Website</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
  <style>
    body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f5f5f5;
}

#results{
  width:36%;
  height:100vh;
  overflow-y:auto;
  padding:20px;
  box-sizing:border-box;
}
    #map {
      height: 500px;
      width: 90%;
    }
  </style>
</head>

<body>

<h2>My Travel Website 🌍</h2>
<input type="text" id="placeInput" placeholder="Search a place..." />
<button onclick="searchPlace()">Search</button>
<button onclick="filterType('hotel')">Hotels</button>
<button onclick="filterType('attraction')">Attractions</button>
<div style="display:flex">


  <div id="results" style="width:30%; height:500px; overflow:auto; border-right:1px solid #ccc; padding:10px;">
    <h3>Results</h3>
  </div>

  <!-- RIGHT: Map -->
  <div id="map"
style="
position:fixed;
top:80px;
right:20px;
width:68%;
height:85vh;
border-radius:16px;
overflow:hidden;
box-shadow:0 0 20px rgba(0,0,0,0.2);
">
</div>

</div>
<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([12.9716, 77.5946], 5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

var markers = [];
var lastLocation = null;
// ✅ Clear markers
function clearMarkers() {
  markers.forEach(marker => map.removeLayer(marker));
  markers = [];
}

// Search place
function searchPlace() {

  var place = document.getElementById("placeInput").value;

  fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${place}`)
    .then(response => response.json())
    .then(data => {

      if (data.length === 0) {
        alert("Place not found");
        return;
      }

      var lat = parseFloat(data[0].lat);
      var lon = parseFloat(data[0].lon);

      lastLocation = { lat, lon };

      // Smooth but fast movement
      map.setView([lat, lon], 10);

      // REMOVE OLD MARKERS ONLY AFTER NEW LOCATION IS READY
      setTimeout(() => {

        clearMarkers();

        var marker = L.marker([lat, lon])
          .addTo(map)
          .bindPopup(place)
          .openPopup();

        markers.push(marker);

      }, 300);

    });
}

// Filter function (Hotels / Attractions)
function filterType(type) {
  if (!lastLocation) {
    alert("Search a place first!");
    return;
  }

  searchFilteredPlaces(lastLocation.lat, lastLocation.lon, type);
}
// Fetch filtered places
function searchFilteredPlaces(lat, lon, type) {

  clearMarkers();
  document.getElementById("results").innerHTML = "<h3>Loading...</h3>";

  let query;

  if (type === "attraction") {
    query = `
      [out:json];
      (
        node["tourism"="attraction"](around:25000, ${lat}, ${lon});
        node["tourism"="museum"](around:25000, ${lat}, ${lon});
        node["tourism"="viewpoint"](around:25000, ${lat}, ${lon});
        node["natural"="waterfall"](around:25000, ${lat}, ${lon});
        node["leisure"="park"](around:25000, ${lat}, ${lon});
      );
      out;
    `;
  } else if (type === "hotel") {
    query = `
      [out:json];
      (
        node["tourism"="hotel"](around:20000, ${lat}, ${lon});
        node["tourism"="guest_house"](around:20000, ${lat}, ${lon});
        node["tourism"="hostel"](around:20000, ${lat}, ${lon});
      );
      out;
    `;
  }

  fetch("https://overpass-api.de/api/interpreter", {
    method: "POST",
    body: query
  })
  .then(res => res.json())
  .then(data => {

    document.getElementById("results").innerHTML = "<h3>Results</h3>";

    data.elements.slice(0, 10).forEach(place => {

      var name = place.tags.name || "Unnamed";

      //Dynamic image
      var img = `https://source.unsplash.com/400x300/?hotel,${encodeURIComponent(name)}`;

      // 📍 Marker with 360 button
      var marker = L.marker([place.lat, place.lon])
        .addTo(map)
        .bindPopup(`
          <b>${name}</b><br>
          📍 Lat: ${place.lat.toFixed(4)}<br>
          📍 Lon: ${place.lon.toFixed(4)}<br><br>
        `);

      marker.on('click', () => map.setView([place.lat, place.lon], 16));

      markers.push(marker);

      // Card UI
      var card = `
        <div style="border:1px solid #ccc; margin:10px; padding:10px; border-radius:10px;">
          <h4>${name}</h4>
          <img src="${img}" width="100%" style="border-radius:8px" loading="lazy">
          <p>Category: ${type}</p>
          <p>⭐ 4.${Math.floor(Math.random()*5)}</p>
          <p>💰 ₹${1000 + Math.floor(Math.random()*4000)}</p>

          <button onclick="openPanorama('${name}')"
style="
padding:10px 18px;
border:none;
border-radius:10px;
background:#111;
color:white;
cursor:pointer;
font-weight:600;
margin-top:10px;
">
View 360°
</button>

        </div>
      `;

      document.getElementById("results").innerHTML += card;
    });
  })
  .catch(err => console.log(err));
}
function getImage(name) {
  return `https://source.unsplash.com/400x300/?hotel,${encodeURIComponent(name)}`;
}

function displayPlaces(data, type) {

  clearMarkers();
  document.getElementById("results").innerHTML = "<h3>Results</h3>";

  data.elements.slice(0, 10).forEach(place => {
    var name = place.tags.name || "Unnamed";

    var marker = L.marker([place.lat, place.lon])
      .addTo(map)
      .bindPopup(`
        <b>${name}</b><br>
      `);

    markers.push(marker);

    //Random image per place
    let img = getImage(name);

    var card = `
      <div style="border:1px solid #ccc; margin:10px; padding:10px; border-radius:10px;">
        <h4>${name}</h4>
        <img src="${img}" width="100%" style="border-radius:8px" loading="lazy">
        <p>⭐ 4.${Math.floor(Math.random()*5)}</p>
        <p>💰 ₹${1000 + Math.floor(Math.random()*4000)}</p>
        <button onclick="openPanorama('${name}')"
style="
padding:10px 18px;
border:none;
border-radius:10px;
background:#111;
color:white;
cursor:pointer;
font-weight:600;
margin-top:10px;
">
View 360°
</button>
      </div>
    `;

    document.getElementById("results").innerHTML += card;
  });
}

function openPanorama(name) {

  const modal =
  document.getElementById("vrModal");

  const frame =
  document.getElementById("vrFrame");

  modal.style.display = "flex";

  let tourURL = "";

  // REAL 360 HOTEL TOURS

  if(name.toLowerCase().includes("goa")) {

    tourURL =
    "https://my.matterport.com/show/?m=SxQL3iGyoDo&play=1&qs=1";

  }

  else if(name.toLowerCase().includes("manali")) {

    tourURL =
    "https://my.matterport.com/show/?m=J7cT9aPqA2D&play=1&qs=1";

  }

  else if(name.toLowerCase().includes("darjeeling")) {

    tourURL =
    "https://my.matterport.com/show/?m=YFuZgdQ5vWj&play=1&qs=1";

  }

  else {

    // fallback luxury hotel VR
    tourURL =
    "https://my.matterport.com/show/?m=SxQL3iGyoDo&play=1&qs=1";
  }

  frame.src = tourURL;

  document.getElementById("fullscreenBtn").style.display = "block";
}

</script>

</body>
</html>
